<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lund Films</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Archivo:wght@700;800&family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=supreme@300,400,500,700&display=swap" rel="stylesheet">
  <meta name="description" content="Lund Films — filmmaker and photographer based in Helsinki, capturing motion and moments through film, 3D animation, and photography.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lund Films">
  <meta property="og:title" content="Lund Films">
  <meta property="og:description" content="Lund Films — filmmaker and photographer based in Helsinki, capturing motion and moments through film, 3D animation, and photography.">
  <meta property="og:url" content="https://lundfilms.fi/">
  <meta property="og:image" content="https://lundfilms.fi/assets/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lund Films">
  <meta name="twitter:description" content="Lund Films — filmmaker and photographer based in Helsinki, capturing motion and moments through film, 3D animation, and photography.">
  <meta name="twitter:image" content="https://lundfilms.fi/assets/og-image.jpg">
</head>
<body>


  <!-- Rough, hand-printed edge filter for the banner text -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="roughEdge" x="-8%" y="-8%" width="116%" height="116%"
            filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2"
                    seed="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <nav>
    <a href="index.html" class="logo">Lund Films</a>
    <div class="nav-links">
      <a href="projects.html">Projects</a>
      <a href="stills.html">Stills</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <!-- Showreel hero -->
  <section class="showreel">
    <div class="showreel-frame">
      <video
        class="showreel-video"
        autoplay
        muted
        loop
        playsinline
        poster="assets/showreel-poster.jpg">
        <source src="assets/showreel.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <!-- Section label above the collage, with an Apple-style word reveal -->
  <div class="collage-intro">
    <p class="reveal-text">A selection of recent films.</p>
  </div>

  <!-- Recent films carousel -->
  <section id="work" class="film-carousel">
    <button class="film-arrow film-prev" type="button" aria-label="Previous films">&larr;</button>

    <div class="film-track">

      <a href="project-4.html" class="tile">
        <div class="tile-media">
          <img src="assets/thumbnails/project-4.jpg" alt="Sting Lookbook" loading="lazy">
        </div>
        <div class="tile-caption"><h3>Sting Lookbook</h3><p>Lookbook · 2026</p></div>
      </a>

      <a href="project-1.html" class="tile">
        <div class="tile-media">
          <img src="assets/thumbnails/project-1.jpg" alt="Sting" loading="lazy">
        </div>
        <div class="tile-caption"><h3>Sting</h3><p>Short Promo · 2025</p></div>
      </a>

      <a href="project-2.html" class="tile">
        <div class="tile-media">
          <img src="assets/thumbnails/project-2.jpg" alt="Secret DIY" loading="lazy">
        </div>
        <div class="tile-caption"><h3>Secret DIY</h3><p>Entertainment · 2025</p></div>
      </a>

      <a href="project-3.html" class="tile">
        <div class="tile-media">
          <img src="assets/thumbnails/project-3.jpg" alt="KMMK Solutions" loading="lazy">
        </div>
        <div class="tile-caption"><h3>KMMK Solutions</h3><p>3D &amp; Animation · 2025 – Ongoing</p></div>
      </a>

    </div>

    <button class="film-arrow film-next" type="button" aria-label="Next films">&rarr;</button>
  </section>

  <!-- CTA -->
  <section class="cta">
    <h2>Let's make something.</h2>
    <a href="contact.html" class="btn">Get in touch</a>
  </section>

  <footer>
    <div class="footer-links"><a href="https://www.instagram.com/lund.films/" target="_blank" rel="noopener">Instagram</a></div>
    <p>&copy; 2026 Lund Films</p>
  </footer>

  <script>
    // Ensure the showreel starts even if the browser defers autoplay
    (function () {
      var v = document.querySelector('.showreel-video');
      if (!v) return;
      function play() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
      play();
      v.addEventListener('loadeddata', play);
      v.addEventListener('canplay', play);
      function onInteract() {
        if (v.paused) play();
        window.removeEventListener('pointerdown', onInteract);
        window.removeEventListener('keydown', onInteract);
        window.removeEventListener('scroll', onInteract);
      }
      window.addEventListener('pointerdown', onInteract, { passive: true });
      window.addEventListener('keydown', onInteract);
      window.addEventListener('scroll', onInteract, { passive: true });
    })();

    // Scroll-driven choreography: scrub in the section label and reveal
    // the CTA as it settles.
    (function () {
      var nav = document.querySelector('nav');
      var collage = document.querySelector('.collage');
      var revealText = document.querySelector('.reveal-text');
      var revealWords = [];
      var ctaH2 = document.querySelector('.cta h2');
      var ctaBtn = document.querySelector('.cta .btn');
      var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
      var ticking = false;

      // Split the label into per-word spans for the scroll-scrubbed reveal
      if (revealText) {
        var words = revealText.textContent.split(' ');
        revealText.textContent = '';
        words.forEach(function (word, i) {
          var s = document.createElement('span');
          s.textContent = word;
          revealText.appendChild(s);
          revealWords.push(s);
          if (i < words.length - 1) {
            revealText.appendChild(document.createTextNode(' '));
          }
        });
      }

      function update() {
        var vh = window.innerHeight;

        // --- Section label: words scrub in ---
        if (revealText && revealWords.length) {
          var lr = revealText.getBoundingClientRect();
          var lp = clamp((vh * 0.86 - lr.top) / (vh * 0.34));
          var n = revealWords.length;
          for (var i = 0; i < n; i++) {
            var local = clamp((lp - i * (0.55 / n)) / 0.45);
            var w = revealWords[i];
            w.style.opacity = local.toFixed(3);
            w.style.transform = 'translateY(' + ((1 - local) * 14).toFixed(1) + 'px)';
            w.style.filter = 'blur(' + ((1 - local) * 6).toFixed(2) + 'px)';
          }
        }

        // --- CTA reveal at the bottom: rises and fades in, no blur ---
        if (ctaH2) {
          var hr = ctaH2.getBoundingClientRect();
          var bp = clamp((vh - hr.top) / (vh * 0.38));
          ctaH2.style.transform = 'translateY(' + ((1 - bp) * 70).toFixed(1) +
            'px) scale(' + (0.95 + 0.05 * bp).toFixed(3) + ')';
          ctaH2.style.opacity = bp.toFixed(3);
          if (ctaBtn) {
            var bp2 = clamp((vh - hr.top - 40) / (vh * 0.38));
            ctaBtn.style.transform = 'translateY(' + ((1 - bp2) * 50).toFixed(1) + 'px)';
            ctaBtn.style.opacity = bp2.toFixed(3);
          }
        }

        ticking = false;
      }

      window.addEventListener('scroll', function () {
        if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    // Film tiles emerge from the dark once the carousel scrolls into view.
    // The whole row reveals together, since tiles parked off to the side of
    // the track would otherwise stay hidden until you scrolled the carousel.
    (function () {
      var section = document.querySelector('.film-carousel');
      var tiles = document.querySelectorAll('.tile');
      if (!section || !tiles.length) return;
      function revealAll() {
        tiles.forEach(function (t, i) {
          t.style.transitionDelay = (i % 2) * 0.08 + 's';
          t.classList.add('in');
        });
      }
      if (!('IntersectionObserver' in window)) { revealAll(); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { revealAll(); io.disconnect(); }
        });
      }, { threshold: 0.15 });
      io.observe(section);
    })();

    // Recent films carousel: arrows page through the track, and grey out
    // when there is nothing further to scroll to.
    (function () {
      var track = document.querySelector('.film-track');
      var prev = document.querySelector('.film-prev');
      var next = document.querySelector('.film-next');
      if (!track || !prev || !next) return;

      function page() {
        var tile = track.querySelector('.tile');
        return tile ? tile.getBoundingClientRect().width + 20 : track.clientWidth;
      }
      function sync() {
        var max = track.scrollWidth - track.clientWidth;
        prev.disabled = track.scrollLeft <= 2;
        next.disabled = track.scrollLeft >= max - 2;
      }
      prev.addEventListener('click', function () {
        track.scrollBy({ left: -page(), behavior: 'smooth' });
      });
      next.addEventListener('click', function () {
        track.scrollBy({ left: page(), behavior: 'smooth' });
      });
      track.addEventListener('scroll', function () {
        window.requestAnimationFrame(sync);
      }, { passive: true });
      window.addEventListener('resize', sync);
      sync();
    })();
  </script>

  <script src="back-to-top.js" defer></script>
</body>
</html>
